[project]
name = "skill-orchestrator-mcp"
version = "0.1.0"
description = "A self-evolving MCP server for dynamic skill creation, code execution, and context-efficient tool composition"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ian & Claude", email = "praht09ian@gmail.com"}
]
requires-python = ">=3.10"
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agent",
    "skill-orchestration",
    "code-execution",
    "fastmcp"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]

dependencies = [
    "mcp>=1.23,<2",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "jsonschema>=4.18",
    "packaging>=23",
]

[project.scripts]
skill-orchestrator-mcp = "skill_orchestrator_mcp.server:run_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skill_orchestrator_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.mypy]
python_version = "3.10"
files = ["skill_orchestrator_mcp"]
strict = true
warn_unreachable = true
# Every dependency (mcp, pydantic, httpx) ships type information, so no
# ignore_missing_imports is needed. Keep it that way.

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-asyncio>=0.21.0",
    "black>=25.11.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-jsonschema>=4.26.0.20261006",
]
