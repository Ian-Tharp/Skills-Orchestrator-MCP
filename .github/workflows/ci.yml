name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so an upstream release that breaks fresh installs is caught
    # even when nobody pushes.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python 3.12

      - name: Ruff
        run: uv run ruff check --output-format=github .

      - name: Mypy (strict, config in pyproject.toml)
        run: uv run mypy

  test:
    name: Tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # The server has Windows-specific subprocess handling and a
          # per-platform sandbox env allowlist; cover oldest and newest Python.
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Pytest
        run: uv run pytest -v

  fresh-install:
    # Every other job installs from uv.lock, so it cannot see a new upstream
    # release that breaks what users get from `pip install` / `uvx --from .`.
    # This job resolves the declared ranges from scratch, the way a user does.
    name: Fresh install, no lockfile (${{ matrix.os }}, py3.12)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Import the server from a fresh resolution
        run: >-
          uv run --isolated --no-project --refresh --python 3.12 --with .
          python -c "import importlib.metadata as m; print('mcp', m.version('mcp'));
          import skill_orchestrator_mcp.server as s; print('ok', s.mcp.name)"
